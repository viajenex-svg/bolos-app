name: deploy

# O Render não auto-deploya porque o repo foi adicionado por URL (sem GitHub App).
# Esta action dispara o deploy a cada push no master.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -fsS --max-time 60 -X POST \
            https://api.render.com/v1/services/srv-dc1gkv942hec73aabrr0/deploys \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'
