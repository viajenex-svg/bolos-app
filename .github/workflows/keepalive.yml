name: manter acordado

# O plano free do Render dorme após ~15 min sem visitas.
# Este ping a cada 10 minutos evita a espera de ~40s na primeira visita.
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar o site da confeitaria
        run: |
          curl -fsS --max-time 60 https://delicias-bolos.onrender.com/api/ping
